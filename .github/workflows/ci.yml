name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version to test'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - '3.10'
          - '3.11'
          - '3.12'

jobs:
  Tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.10.1
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event.inputs.python-version == '3.10' && fromJson('["3.10"]') || github.event.inputs.python-version == '3.11' && fromJson('["3.11"]') || github.event.inputs.python-version == '3.12' && fromJson('["3.12"]') || fromJson('["3.10", "3.11", "3.12"]') }}
        # Run the suite under both NumPy major versions. Extensions are built
        # against NumPy 2 (ABI-compatible with 1.x), so both legs must pass.
        numpy: ['1', '2']
        include:
          - numpy: '1'
            numpy-spec: '>=1.23,<2'
          - numpy: '2'
            numpy-spec: '>=2,<3'
    steps:
      - name: Install system requirements
        # libgl1/libglib2.0-0 are runtime libs that opencv-python (pulled in
        # by the detect extra) loads at import time; the gdal:ubuntu-small
        # image does not ship them.
        run: apt update -y && apt install -y nodejs g++ git python3-dev libgl1 libglib2.0-0

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # For setuptools-scm

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Enable caching
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create venv
        run: rm -rf .venv && uv venv

      - name: Constrain NumPy for this leg
        # Pin NumPy at *resolution* time, not after the fact. A post-hoc
        # ``uv pip install "numpy<2"`` only swaps NumPy and leaves dependencies
        # such as SciPy on a NumPy-2-only build (which then fails importing
        # ``np.long``/``np.ulong``). Feeding the pin to uv as a constraint
        # makes the resolver pick a mutually compatible SciPy/OpenCV/etc.
        run: |
          echo "numpy${{ matrix.numpy-spec }}" > "$RUNNER_TEMP/numpy-constraint.txt"
          echo "UV_CONSTRAINT=$RUNNER_TEMP/numpy-constraint.txt" >> "$GITHUB_ENV"

      - name: Install Python packages
        run: |
          uv pip install gdal[numpy]==$(gdal-config --version)
          uv pip install .[stac,web,tests]

      - name: Confirm NumPy major version for this leg
        # Fail loudly if the constraint did not take effect rather than
        # silently testing the wrong NumPy major version.
        run: |
          python -c "import numpy, sys; got = numpy.__version__.split('.')[0]; want = '${{ matrix.numpy }}'; print('Testing against NumPy', numpy.__version__); sys.exit(0 if got == want else 'expected NumPy %s.x, got %s' % (want, numpy.__version__))"

      - name: Run Unittests
        run: |
          cd tests && python -m unittest discover -p 'test_*.py'

      - name: Verify detect/ml extras resolve under NumPy 2
        if: matrix.numpy == '2'
        run: |
          uv pip install ".[detect,ml]"
          python -c "import cv2, numba, numpy; print('cv2', cv2.__version__, '| numba', numba.__version__, '| numpy', numpy.__version__)"

      - name: Run ml Unittests
        run: |
          uv pip install testfixtures
          uv pip install --reinstall-package geowombat ".[ml,dl]"
          cd tests && python -m unittest discover -p 'ml_*.py'

  Tests-result:
    if: always()
    needs: [Tests]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.Tests.result }}" == "success" ]]; then
            echo "All tests passed"
            exit 0
          else
            echo "Some tests failed"
            exit 1
          fi
