name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    # Only run if CI succeeded and was triggered by a push (not a PR)
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # semantic-release needs full history + tags

      # python-semantic-release owns the whole flow: determine the next
      # version from commit messages, update CHANGELOG.md, commit it,
      # create + push the tag, and create the GitHub release (which
      # triggers publish.yml). This is idempotent — if no feat/fix/perf
      # commit has landed since the last tag it is a no-op, and it never
      # re-tags an already-released version (the bug that broke the
      # previous --print + manual-tag approach when v2.4.0 existed).
      #
      # The changelog is generated from commit messages (and bodies), so
      # write descriptive Conventional-Commit messages / PR squash bodies
      # — those become the release notes. PSR inserts new version
      # sections at the `<!-- version list -->` marker in CHANGELOG.md
      # and pushes a `chore(release): vX.Y.Z` commit back to main.
      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog: "true"
          commit: "true"
          tag: "true"
          push: "true"
          vcs_release: "true"
