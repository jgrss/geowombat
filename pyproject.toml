[build-system]
build-backend = "mesonpy"
# Build against NumPy 2.x: the resulting C extensions are ABI-backward
# compatible with NumPy >=1.19 at runtime, so a single build serves both
# NumPy 1.x and 2.x users. Cython >=3.0 is required to cimport NumPy 2 headers.
requires = ["meson-python", "numpy>=2.0.0", "cython>=3.0", "setuptools-scm"]

[project]
name = "geowombat"
dynamic = ["version"]
description = "Utilities for geospatial data"
readme = "README.md"
license = {file = "LICENSE.txt"}
authors = [{name = "Jordan Graesser"}]
maintainers = [{name = "Jordan Graesser"}]
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "dask[array,dataframe]",
    "distributed",
    "geopandas",
    "joblib",
    "matplotlib",
    "numpy>=1.23,<3",
    "pandas",
    "pyproj",
    "rasterio<1.5.0",
    "retry",
    "requests",
    "scikit-learn",
    "scipy",
    "shapely",
    "tqdm",
    "xarray",
    "h5netcdf",
    "h5py",
    "cryptography",
    "threadpoolctl",
]

[project.optional-dependencies]
docs = [
    "numpydoc",
    # Sphinx 7+ breaks `autosectionlabel` against MyST-rendered content
    # and conflicts with sphinx-book-theme 1.x. Keep on the 6.x line.
    "sphinx>=6.0,<7",
    "sphinx-automodapi",
    "sphinxcontrib-bibtex>=2.5.0",
    "sphinx_tabs",
    "pydata-sphinx-theme==0.13.1",
    "sphinx-book-theme>=1.0.0,<2",
    "sphinx-copybutton>=0.5.0",
    "sphinx-autodoc-typehints",
    "ipython",
    "graphviz",
    "sklearn-xarray-ext",
    # Notebook chapter renderer (object_detection.ipynb, etc.).
    # nbsphinx 0.9.x is the last line tested against sphinx 6.
    "nbsphinx>=0.9,<1",
    "ipykernel",
    # ipywidgets backs tqdm.auto progress bars and interactive output in
    # the example notebooks (STAC downloads, training loops).
    "ipywidgets",
    # myst-parser is registered for future Markdown content in the
    # docs tree. 1.x is the Sphinx 6-compatible line.
    "myst-parser>=1.0,<2",
]

tests = [
    "testfixtures",
    "pooch",
    "jax",
    "jaxlib",
    "pre-commit",
    "black",
    "flake8",
    "docformatter",
    "isort",
    "validators",
]

coreg = [
    "earthpy",
    "pyfftw==0.13.1",
    "bottleneck",
    "cartopy",
    "cmocean",
    "dill",
    "geoarray>=0.15.0",
    "geojson",
    "folium>=0.6.0,!=0.12.0",
    "pykrige",
    "py_tools_ds>=0.18.0",
]

zarr = [
    "zarr",
    "numcodecs",
]

ml = [
    "dask-ml>=2024.4.4",
    "scikit-learn>=1.3.0",
    "lightgbm",
    "sklearn-xarray-ext",
    "numpy_groupies",
    "numba>=0.57.0",
]

perf = [
    "rtree",
    "pygeos",
    "netCDF4",
    "ray>=2.3.0",
]

time = ["dateparser"]

view = [
    "ipython",
    "bokeh",
    "descartes",
    "graphviz",
]

stac = [
    "pystac",
    "pystac-client",
    "stackstac>=0.5.1",
    "planetary-computer",
    "Rich",
    "wget",
]

web = [
    "gsutil",
    "requests",
    "wget",
]

dl = [
    "torch>=2.0.0",
    "pytorch-tabnet>=4.0",
    "torchgeo>=0.6.0",
    "segmentation-models-pytorch>=0.3.0",
]

detect = [
    "ultralytics>=8.2",
    "torchmetrics>=1.0",
    "pycocotools",
    "pyyaml",
    "pillow",
    # Now that geowombat supports numpy>=2, leave opencv-python unpinned and
    # let the resolver match it to the installed numpy: opencv>=4.12 under
    # numpy 2.x, an older numpy-1-compatible build under numpy 1.x.
    "opencv-python",
]

sam = [
    "segment-anything>=1.0",
]

# all optional features in one install (`pip install "geowombat[all]"`).
all = [
    "geowombat[ml,dl,detect,sam,stac,coreg,perf,time,view,web,zarr]",
]

[project.urls]
Homepage = "https://github.com/jgrss/geowombat"
Documentation = "https://geowombat.readthedocs.io"
Repository = "https://github.com/jgrss/geowombat"

[tool.setuptools_scm]
write_to = "src/geowombat/_version.py"

[tool.semantic_release]
version_toml = []
version_variables = []
tag_format = "v{version}"
commit_message = "chore(release): v{version}"
build_command = ""
major_on_zero = false

[tool.semantic_release.changelog]
# "update" inserts new release sections at the insertion_flag and leaves
# the rest of CHANGELOG.md untouched. The default ("init") would rebuild
# the whole file from git history and clobber any curated content.
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "style", "test", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.vscode
  | \.idea
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
